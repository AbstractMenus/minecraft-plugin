// Common configuration applied to every subproject.
// Subproject-specific plugins (java-library, shadow, paperweight) stay in subprojects.

plugins {
    // Root needs the base lifecycle ('build', 'assemble', 'clean') so we
    // can hook the dist aggregator below into it.
    id 'base'
}

allprojects {
    group   = 'ru.abstractmenus'
    version = '2.0.0-alpha'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    test {
        useJUnitPlatform()
    }
}

// -----------------------------------------------------------------------
//  dist - aggregate every shipping artifact into <root>/build/dist/
//
//  Mirrors the user-facing files in one place so a server admin (or CI)
//  can grab everything with a single cp / scp:
//
//      build/dist/
//        AbstractMenus-<ver>.jar              (plugin, fat shadow)
//        AbstractMenus-api-<ver>.jar          (api binary, Maven coord
//                                              ru.abstractmenus:api:<ver>)
//        AbstractMenus-api-<ver>-sources.jar
//        AbstractMenus-api-<ver>-javadoc.jar
//
//  The per-module build/libs/ directories are unchanged - existing CI
//  paths and Gradle's incremental cache keep working.
//
//  ./gradlew build automatically runs dist as a finalizer, so a normal
//  build leaves everything in build/dist/. Run ./gradlew dist alone if
//  you only need to refresh the aggregate (skips tests).
// -----------------------------------------------------------------------
tasks.register('dist', Copy) {
    description = 'Aggregates shipping artifacts into build/dist/.'
    group = 'distribution'

    def pluginShadow = project(':plugin').tasks.named('shadowJar')
    def apiJar       = project(':api').tasks.named('jar')
    def apiSources   = project(':api').tasks.named('sourcesJar')
    def apiJavadoc   = project(':api').tasks.named('javadocJar')

    dependsOn pluginShadow, apiJar, apiSources, apiJavadoc

    from(pluginShadow.flatMap { it.archiveFile })
    from(apiJar.flatMap       { it.archiveFile })
    from(apiSources.flatMap   { it.archiveFile })
    from(apiJavadoc.flatMap   { it.archiveFile })

    into layout.buildDirectory.dir('dist')
}

// Hook dist into every common dev-cycle entry point so the aggregate in
// build/dist/ is always fresh, regardless of which command the dev ran.
//
//   ./gradlew shadowJar  -> finalizes :dist (fast loop "fix -> server")
//   ./gradlew assemble   -> finalizes :dist (all artifacts, no tests)
//   ./gradlew build      -> finalizes :dist (artifacts + tests)
//   ./gradlew dist       -> dist itself
//
// finalizedBy is correct here (vs dependsOn) because we want dist to run
// AFTER the upstream task succeeds, not be pulled in as its dependency.
tasks.named('build').configure { finalizedBy('dist') }
tasks.named('assemble').configure { finalizedBy('dist') }

// :plugin:shadowJar is the hot-path command during plugin development;
// hook it directly so the dev-loop jar lands in build/dist/ too.
project(':plugin').afterEvaluate {
    project(':plugin').tasks.named('shadowJar').configure {
        finalizedBy(':dist')
    }
}
