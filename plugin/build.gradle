plugins {
    id 'com.gradleup.shadow'               version '9.6.1'
}

// Plugin-specific repos not already in root
repositories {
    maven { url = 'https://repo.tcoded.com/releases' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    maven {
        url = 'https://repo.codemc.org/repository/maven-public/'
        metadataSources { artifact() }
    }
    maven {
        url = 'https://repo.codemc.org/repository/maven-snapshots/'
        metadataSources { artifact() }
    }
    maven {
        url = 'https://repo.codemc.org/repository/maven-releases/'
        metadataSources { artifact() }
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'

    implementation project(':api')

    implementation 'com.fathzer:javaluator:3.0.9'

    // Adventure (Component, MiniMessage, LegacyComponentSerializer) is
    // bundled INSIDE Paper itself (via paper-api's BOM). Pull it in
    // compileOnly so we get the types at compile time but do not bundle
    // ~2.7 MB of duplicate Adventure classes into the shadow jar.
    // adventure-platform-bukkit was used by nothing in our code so it is
    // dropped entirely.
    compileOnly 'net.kyori:adventure-text-minimessage:5.2.0'

    implementation "com.tcoded:FoliaLib:0.5.2"

    shadow files('libs/MMOItems-6.5.4.jar')
    shadow files('libs/citizens-2.0.jar')

    shadow ('de.tr7zw:item-nbt-api-plugin:2.16.1') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }
    shadow ('com.arcaniax:HeadDatabase-API:1.3.2') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }
    shadow ('com.github.MilkBowl:VaultAPI:1.7.1') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
        exclude group: 'org.bukkit'
    }
    shadow ('net.luckperms:api:5.5') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }
    shadow ('com.sk89q.worldguard:worldguard-bukkit:7.0.21') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
        exclude group: 'org.bukkit'
        exclude group: 'io.papermc.paper'
    }

    compileOnly 'me.clip:placeholderapi:2.12.3'

    shadow ('io.lumine:MythicLib:1.0.12-SNAPSHOT') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }
    shadow ('com.github.LoneDev6:api-itemsadder:3.6.1') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }
    shadow ('net.skinsrestorer:skinsrestorer-api:15.12.6') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
    }

    testImplementation 'io.papermc.paper:paper-api:26.3.build.+'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.120.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

// The :plugin module ships as a fat jar named AbstractMenus-<ver>.jar.
// Default Gradle naming would produce 'plugin-<ver>.jar' (using the
// subproject directory name), which is misleading on disk for ops.
base {
    archivesName = 'AbstractMenus'
}

processResources {
    filesMatching("plugin.yml") {
        expand([version: project.version])
    }
}

// Thin jar lands as AbstractMenus-<ver>-thin.jar so it cannot be confused
// with the user-facing fat jar produced by shadowJar. Devs-only artifact.
jar {
    archiveClassifier.set('thin')
}

shadowJar {
    relocate "com.tcoded.folialib", "ru.abstractmenus.lib.folialib"
    dependencies {
        exclude dependency('org.inventivetalent.spiget-update:bukkit')
    }
    // Drop the default 'all' classifier so the fat jar is the canonical
    // AbstractMenus-<ver>.jar that operators drop into plugins/.
    archiveClassifier.set('')
}

test {
    exclude 'ru/abstractmenus/bench/**'
}

tasks.register('jmh', JavaExec) {
    description = 'Run JMH benchmarks'
    group = 'benchmark'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.abstractmenus.bench.RunBenchmarks'

    def benchFilter = project.findProperty('bench') ?: ''
    if (benchFilter) {
        args = ["ru.abstractmenus.bench.*${benchFilter}*"]
    }
}
