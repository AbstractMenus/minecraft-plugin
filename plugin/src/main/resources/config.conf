#
# AbstractMenus configuration
#

# Using variables. If true - it will create database file in plugin folder
variables: true

# Do you want to synchronize variables between al bungeecord servers?
syncVariables: false

# Enable, if you use BungeeCord proxy and need to use bungeeConnect action. This registers BungeeCord channel.
bungeecord: false

# Enable, if you want to use BungeeCord rules. Then plugin start ping BungeeCord servers to check their online
bungeePing: false

# Enable, if you want to use WorldGuard menu activators
useWorldGuard: false

# Enable, if you want to use MiniMessage in items and messages
# Disabled by default, to avoid additional strings parsing
useMiniMessage: false

# The full path to the folder with menu files.
# If you want to create shared menus folder for all servers,
# just change this param to absolute path of required folder
menusFolder: "default"

logOpenMenus: false

# The full path to the folder with variables .db file
dbFolder: "default"

# Configure time formatting
time {
    day: "d"
    hour: "h"
    minute: "min"
    second: "sec"
}

# Default provider selection. Values: an explicit provider id (e.g.
# "vault", "playerpoints") or "auto" to use priority-based resolution
# (highest-priority registered provider wins). Per-action overrides in
# menus (via `provider: "..."`) always take precedence over this default.
providers {
  economy      = "auto"
  permissions  = "auto"
  levels       = "auto"
  placeholders = "auto"
  skins        = "auto"
}

# Click debounce floors (milliseconds). Active when a menu item has
# clickCooldown > 0 (default = 1 tick); the user's clickCooldown wins
# only when it's larger than the floor. Set clickCooldown:0 on an item
# to bypass the cooldown (and the floor) entirely.
#
# Why this exists: the vanilla Minecraft client emits extra packets per
# physical click during rapid input, and there's no way to tell them
# apart from real clicks server-side. The floor turns those into a
# capped fire rate so one physical click stays one action.
#
#   default - LEFT / RIGHT / MIDDLE / etc. 80ms is enough because the
#             synthetic DOUBLE_CLICK event Mojang piggybacks on rapid
#             same-slot clicks is already filtered semantically inside
#             the plugin.
#
#   shift   - SHIFT_LEFT / SHIFT_RIGHT. The client emits ~3 extra
#             QUICK_MOVE packets per shift-click at ~70ms intervals,
#             with the last one ~200ms after the original. 250ms
#             catches all of them. Lower (e.g. 200) trades safety for
#             responsiveness; raise it if you observe duplicates.
clickDebounce {
  default = 80
  shift = 250
}