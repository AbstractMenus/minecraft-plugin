name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # - name: Cache Gradle
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-

      - name: List jars in gradle/libs
        run: ls -la gradle/libs || echo "No jars found!"

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build --refresh-dependencies --info

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: '(${{ github.ref_name }}) ${{ github.event.head_commit.message }} (${{ github.sha }})'
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          tag_name: ${{ github.ref_name }}-${{ github.sha }}
          files: |
            build/libs/*.jar
